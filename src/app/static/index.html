<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDU Club Events</title>
<link href="/static/style.css" rel="stylesheet">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="site-header">
  <div class="shell header-inner">
    <h1>SDU Club Events</h1>
    <div class="header-actions">
      <button type="button" id="account-button" class="header-action" data-open="account" hidden>Sign in</button>
      <label id="demo-user" class="demo-user" hidden>Demo user
        <select id="user">
          <option value="1">Club Organizer (SDU Robotics Club)</option>
          <option value="2">Student One (Telegram linked)</option>
          <option value="3">Student Two (e-mail only)</option>
          <option value="4">Platform Admin</option>
        </select>
      </label>
    </div>
  </div>
</header>

<div class="nav-shell">
  <nav class="shell navigation" aria-label="Main navigation">
    <button type="button" data-open="catalog" aria-current="page">Events</button>
    <button type="button" data-open="registrations" data-role="student" hidden>My registrations</button>
    <button type="button" data-open="clubs">Clubs</button>
    <button type="button" data-open="admin" data-role="admin" hidden>Administration</button>
    <button type="button" data-open="outbox" id="outbox-nav" hidden>Demo outbox</button>
  </nav>
</div>

<main class="shell">
  <p id="page-message" class="message" role="status"></p>
  <section data-page="catalog">
    <div id="catalog-layout" class="workspace">
      <section class="panel" aria-labelledby="catalog-heading">
        <h2 id="catalog-heading">Events</h2>
        <form id="filters" class="filters" role="search" aria-label="Event catalog">
          <label class="search">Search events
            <input id="search" name="q" type="search" maxlength="200" placeholder="Title, description or venue">
          </label>
          <label>Category
            <select id="category-filter" name="category"><option value="">All categories</option></select>
          </label>
          <label>Event date
            <input id="date-filter" name="date" type="date">
          </label>
          <label>Hosting club
            <select id="club-filter" name="club_id"><option value="">All clubs</option></select>
          </label>
        </form>
        <p id="event-status" class="catalog-status" role="status">Loading events…</p>
        <button id="clear-filters" class="secondary" type="button" hidden>Clear filters</button>
        <button id="retry-events" class="secondary" type="button" hidden>Retry loading events</button>
        <div id="events" class="events"></div>
        <div class="button-row pagination" id="pagination" hidden>
          <button type="button" id="previous-page" class="secondary">Previous</button>
          <button type="button" id="next-page" class="secondary">Next</button>
        </div>
      </section>

      <section id="event-editor" class="panel" aria-labelledby="create-heading" hidden>
        <h2 id="create-heading">Create event</h2>
        <form id="create" class="create-form">
          <label>Hosting club <select name="club_id" required></select></label>
          <label>Title <input name="title" maxlength="200" required></label>
          <label>Description <textarea name="description"></textarea></label>
          <label>Starts at <input name="starts_at" type="datetime-local" required></label>
          <label>Venue <input name="venue" required></label>
          <label>Category <input name="category" value="Workshop" required></label>
          <label>Capacity <input name="capacity" type="number" min="1" value="30" required></label>
          <div class="button-row">
            <button type="submit" id="save-event">Create event</button>
            <button type="button" class="secondary" id="cancel-edit" hidden>Stop editing</button>
          </div>
        </form>
        <p id="create-message" class="message" role="status"></p>
      </section>
    </div>
  </section>

  <section data-page="registrations" class="panel" hidden aria-labelledby="registrations-heading">
    <h2 id="registrations-heading">My registrations</h2>
    <p id="registrations-status" class="catalog-status" role="status"></p>
    <div id="my-registrations" class="events"></div>
  </section>

  <section data-page="clubs" id="clubs-page" hidden></section>
  <section data-page="account" id="account-page" hidden></section>
  <section data-page="admin" id="admin-page" hidden></section>

  <section data-page="outbox" class="panel outbox-panel" aria-labelledby="outbox-heading" hidden>
    <h2 id="outbox-heading">Notification outbox</h2>
    <p>Demo deliveries are printed in the server console.</p>
    <button id="dispatch" type="button">Send pending notifications</button>
    <p id="dispatch-message" class="message" role="status"></p>
    <p id="outbox-status" class="outbox-state" role="status">Loading notifications…</p>
    <div class="table-scroll" role="region" aria-label="Queued notifications" tabindex="0" hidden>
      <table id="outbox" aria-labelledby="outbox-heading">
        <thead><tr><th scope="col">#</th><th scope="col">To user</th><th scope="col">Message</th><th scope="col">Status</th><th scope="col">Attempts</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<template id="event-card">
  <article class="event">
    <span class="category"></span>
    <h3></h3>
    <p class="event-details"><time></time><br><span class="venue"></span><br><span class="host"></span></p>
    <p class="event-description" hidden></p>
    <div class="button-row"></div>
    <p class="message registration-message" role="status"></p>
  </article>
</template>

<dialog id="participants" class="panel" aria-labelledby="participants-heading">
  <div class="button-row dialog-row">
    <h2 id="participants-heading">Participants</h2>
    <form method="dialog"><button class="secondary">Close</button></form>
  </div>
  <p id="participants-status" class="catalog-status" role="status"></p>
  <div id="participant-list" class="events"></div>
</dialog>
</body>
</html>
